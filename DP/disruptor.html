<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disruptor - High Performance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center">

  <section class="max-w-4xl mx-auto px-6 py-16">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-10 shadow-2xl">
      <span class="inline-block px-4 py-1 text-sm font-semibold text-cyan-400 bg-cyan-400/10 rounded-full">
        Performance
      </span>

      <h1 class="mt-6 text-5xl md:text-6xl font-extrabold tracking-tight">
        Disruptor
      </h1>

      <h2 class="mt-4 text-3xl font-bold text-cyan-400">
        High Performance
      </h2>

      <p class="mt-6 text-lg text-slate-300 leading-relaxed">
        High-throughput inter-thread messaging designed for ultra-low latency
        systems. Built to maximize performance by minimizing contention and
        efficiently coordinating communication between threads.
      </p>

      <div class="mt-10 flex flex-wrap gap-4">
        <button class="px-6 py-3 bg-cyan-500 hover:bg-cyan-600 transition rounded-lg font-semibold">
          Learn More
        </button>

        <button class="px-6 py-3 border border-slate-600 hover:border-cyan-400 hover:text-cyan-400 transition rounded-lg font-semibold">
          Documentation
        </button>
      </div>
    </div>
  </section>

</body>
</html>
