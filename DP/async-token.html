<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asynchronous Completion Token</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center p-6">
  <main class="w-full max-w-3xl">
    <section
      class="rounded-3xl border border-slate-800 bg-slate-900 p-8 text-center shadow-2xl shadow-black/30"
    >
      <div class="mb-8">
        <span
          class="inline-flex rounded-full bg-indigo-500/10 px-4 py-1.5 text-sm font-medium text-indigo-400 ring-1 ring-inset ring-indigo-500/20"
        >
          Concurrency
        </span>
      </div>

      <h1 class="text-4xl font-bold tracking-tight text-white sm:text-5xl">
        Asynchronous Completion Token
      </h1>

      <div
        class="mx-auto mt-6 h-px w-24 bg-gradient-to-r from-transparent via-indigo-500 to-transparent"
      ></div>

      <p
        class="mx-auto mt-8 max-w-2xl text-lg leading-8 text-slate-300 sm:text-xl"
      >
        Associates asynchronous operations with their
        <span class="font-semibold text-indigo-400">completion handlers</span>.
      </p>
    </section>
  </main>
</body>
</html>
