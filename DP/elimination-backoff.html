<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elimination Backoff</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen flex items-center justify-center p-6">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8">
    <div class="inline-block px-3 py-1 mb-4 text-sm font-semibold text-emerald-700 bg-emerald-100 rounded-full">
      Concurrent Algorithms
    </div>

    <h1 class="text-4xl font-bold text-slate-800 mb-4">
      Elimination Backoff
    </h1>

    <p class="text-lg text-slate-600 leading-relaxed">
      Reduces contention in concurrent stacks by allowing complementary
      operations to complete directly without accessing the shared data
      structure, improving scalability under high contention.
    </p>
  </div>

</body>
</html>
