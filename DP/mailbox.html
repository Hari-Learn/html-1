<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mailbox</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">


<div class="text-center">

  <!-- Title -->
  <h1 class="text-4xl font-bold text-slate-800 mb-10">
    Mailbox
  </h1>


  <!-- UK Mailbox -->
  <div class="relative w-72 h-[500px] mx-auto">


    <!-- Rounded Top -->
    <div class="absolute top-0 left-0 w-full h-44 bg-red-700 rounded-t-[140px] shadow-xl">
      
      <!-- Royal Mail Style Circle -->
      <div class="absolute top-10 left-1/2 -translate-x-1/2 
                  w-20 h-20 rounded-full bg-red-800 
                  border-4 border-yellow-400 flex items-center justify-center">
        <span class="text-yellow-300 font-bold text-xl">
          ✉
        </span>
      </div>

    </div>


    <!-- Main Body -->
    <div class="absolute top-32 w-full h-72 bg-red-700 rounded-b-xl shadow-2xl">


      <!-- Mail Slot -->
      <div class="absolute top-10 left-1/2 -translate-x-1/2
                  w-44 h-10 bg-black rounded-full
                  border-4 border-gray-300 shadow-inner">

        <div class="w-20 h-1 bg-gray-400 mx-auto mt-3 rounded"></div>

      </div>


      <!-- Mail Drop Label -->
      <div class="absolute top-28 left-1/2 -translate-x-1/2
                  text-center text-white">

        <p class="font-bold text-lg">
          MAIL
        </p>

        <p class="text-sm opacity-80">
          POST HERE
        </p>

      </div>


      <!-- Door -->
      <div class="absolute bottom-8 left-1/2 -translate-x-1/2
                  w-40 h-24 bg-red-800 rounded-lg
                  border-2 border-red-900">

        <div class="absolute right-3 top-1/2 
                    w-3 h-3 bg-yellow-400 rounded-full">
        </div>

      </div>


    </div>


    <!-- Stand -->
    <div class="absolute bottom-0 left-10 w-12 h-16 bg-red-800 rounded-b-lg"></div>
    <div class="absolute bottom-0 right-10 w-12 h-16 bg-red-800 rounded-b-lg"></div>


  </div>


  <!-- Description Card -->
  <div class="mt-10 max-w-xl bg-white p-6 rounded-xl shadow-lg">

    <span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm">
      Physical Mailbox
    </span>


    <p class="mt-4 text-slate-600 leading-7">

      A traditional mailbox allows people to insert letters through the
      front opening. The collected mail is stored inside and removed by
      the postal worker.

    </p>


  </div>


</div>


</body>
</html>
