<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Stub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
  <main class="flex min-h-screen items-center justify-center px-6">
    <section class="w-full max-w-2xl rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">
      <div class="mb-6 flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-violet-500 font-bold">
          TS
        </div>
        <div>
          <h1 class="text-xl font-semibold">Test Stub</h1>
          <p class="text-sm text-slate-400">Predictable test behavior</p>
        </div>
      </div>

      <div class="rounded-xl border border-violet-500/20 bg-violet-500/10 p-6">
        <p class="text-lg leading-relaxed text-slate-200">
          Provides predetermined responses to a test.
        </p>
      </div>

      <div class="mt-6 grid gap-4 sm:grid-cols-3">
        <div class="rounded-lg bg-slate-800 p-4">
          <p class="text-xs uppercase tracking-wider text-slate-500">Status</p>
          <p class="mt-1 font-medium text-emerald-400">Ready</p>
        </div>
        <div class="rounded-lg bg-slate-800 p-4">
          <p class="text-xs uppercase tracking-wider text-slate-500">Response</p>
          <p class="mt-1 font-medium">Predetermined</p>
        </div>
        <div class="rounded-lg bg-slate-800 p-4">
          <p class="text-xs uppercase tracking-wider text-slate-500">Purpose</p>
          <p class="mt-1 font-medium">Testing</p>
        </div>
      </div>
    </section>
  </main>

</html>
