 Spike Testing HTML Page

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spike Testing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
  <main class="w-full max-w-5xl">
    <section class="overflow-hidden rounded-3xl border border-slate-800 bg-slate-900 shadow-2xl">
      <div class="grid md:grid-cols-2">

        <div class="p-8 md:p-12">
          <div class="mb-6 inline-flex rounded-full bg-red-500/10 px-4 py-2 text-sm
                      font-semibold uppercase tracking-widest text-red-400">
            Performance Testing
          </div>

          <h1 class="text-5xl font-bold tracking-tight md:text-6xl">
            Spike Testing
          </h1>

          <p class="mt-6 text-lg leading-8 text-slate-300">
            Suddenly increases/decreases load to evaluate system behavior.
          </p>

          <div class="mt-8 flex gap-3">
            <span class="rounded-lg bg-slate-800 px-4 py-2 text-sm text-slate-300">
              Sudden Load
            </span>
            <span class="rounded-lg bg-slate-800 px-4 py-2 text-sm text-slate-300">
              Recovery
            </span>
          </div>
        </div>

        <div class="flex items-center justify-center bg-slate-950 p-8">
          <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-slate-400">System Load</p>
                <p class="text-2xl font-bold">Spike Detected</p>
              </div>
              <div class="rounded-full bg-red-500/15 px-3 py-1 text-xs text-red-400">

              </div>
            </div>

            <div class="mt-8 flex h-40 items-end gap-2">
              <div class="h-10 w-full rounded-t bg-blue-500"></div>

              <div class="h-20 w-full rounded-t bg-blue-500"></div>
              <div class="h-36 w-full rounded-t bg-red-500"></div>
              <div class="h-32 w-full rounded-t bg-red-500"></div>
              <div class="h-24 w-full rounded-t bg-orange-500"></div>
              <div class="h-16 w-full rounded-t bg-blue-500"></div>
              <div class="h-12 w-full rounded-t bg-blue-500"></div>
            </div>

            <div class="mt-4 flex justify-between text-xs text-slate-500">
              <span>Normal</span>
              <span>Sudden Spike</span>
              <span>Recovery</span>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>
