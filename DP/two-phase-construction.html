<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two-Phase Construction</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">

  <main class="w-full max-w-4xl">
    <section class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl">

      <header class="border-b border-slate-800 px-8 py-6">
        <h1 class="text-2xl font-bold tracking-tight">
          Object Creation Patterns
        </h1>
        <p class="mt-1 text-sm text-slate-400">
          A concise overview of object construction techniques.
        </p>
      </header>

      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-slate-800/70">
            <tr>
              <th class="px-6 py-4 text-sm font-semibold text-slate-200">
                Technique
              </th>
              <th class="px-6 py-4 text-sm font-semibold text-slate-200">
                Category
              </th>
              <th class="px-6 py-4 text-sm font-semibold text-slate-200">
                Description
              </th>
            </tr>
          </thead>

          <tbody>
            <tr class="border-t border-slate-800 transition-colors hover:bg-slate-800/40">
              <td class="px-6 py-6">
                <span class="inline-flex rounded-full bg-blue-500/10 px-3 py-1 text-sm font-semibold text-blue-400 ring-1 ring-inset ring-blue-500/20">
                  Two-Phase Construction
                </span>
              </td>

              <td class="px-6 py-6">
                <span class="font-semibold text-emerald-400">
                  Object creation
                </span>
              </td>

              <td class="px-6 py-6 leading-relaxed text-slate-300">
                Separate allocation from initialization
                <span class="font-semibold text-white">under 150 lines</span>.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </section>
  </main>

</body>
</html>
